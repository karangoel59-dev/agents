<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recursive DAG Agent Interface</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: inherit;
            box-sizing: border-box;
        }
        textarea {
            height: 100px;
            resize: vertical;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            color: #fff;
            background-color: #3498db;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #2980b9;
        }
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        .status-container, .history-container {
            margin-top: 30px;
            padding: 20px;
            border: 1px solid #e1e8ed;
            border-radius: 4px;
            background-color: #f9fbfd;
        }
        .status-container { display: none; }
        .history-container {
            max-height: 200px;
            overflow-y: auto;
        }
        .history-item {
            padding: 8px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
        }
        .history-item:hover {
            background-color: #eef2f5;
        }
        .history-item .status {
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .status-finished { background-color: #2ecc71; color: #fff; }
        .status-running { background-color: #f39c12; color: #fff; }
        .status-item {
            margin-bottom: 10px;
        }
        .status-label {
            font-weight: bold;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #result-container {
            margin-top: 30px;
            display: none;
        }
        #result-content {
            white-space: pre-wrap;
            background: #fdfdfd;
            padding: 20px;
            border: 1px solid #e1e8ed;
            border-radius: 4px;
            font-family: Georgia, serif;
            line-height: 1.6;
            max-height: 500px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Agent Task Runner</h1>
    
    <div class="form-group">
        <label for="model-select">Model Version</label>
        <select id="model-select">
            <option value="gpt-4.1">gpt-4.1</option>
            <option value="gpt-4.1-2">gpt-4.1-2</option>
            <option value="gpt-4.1-mini">gpt-4.1-mini</option>
            <option value="gpt-4.1-mini-2">gpt-4.1-mini-2</option>
            <option value="gpt-4.1-mini-standard">gpt-4.1-mini-standard</option>
            <option value="gpt-4.1-nano">gpt-4.1-nano</option>
            <option value="gpt-4o" selected>gpt-4o</option>
            <option value="gpt-4o-mini">gpt-4o-mini</option>
            <option value="gpt-4o-standard">gpt-4o-standard</option>
            <option value="gpt-5-mini">gpt-5-mini</option>
            <option value="gpt-5-nano">gpt-5-nano</option>
            <option value="gpt-5.4-mini">gpt-5.4-mini</option>
            <option value="gpt-5.4-nano">gpt-5.4-nano</option>
        </select>
    </div>

    <div class="form-group">
        <label for="goal">Task Goal / Prompt</label>
        <textarea id="goal" placeholder="e.g., A sci-fi story about an astronaut discovering a derelict alien ship..."></textarea>
    </div>
    
    <div class="btn-group">
        <button id="btn-story" onclick="startTask('story')">Run Story Task</button>
        <button id="btn-report" onclick="startTask('report')">Run Report Task</button>
        <button id="btn-refresh-history" onclick="fetchHistory()" style="background-color: #95a5a6; margin-left: auto;">Refresh History</button>
    </div>

    <div id="history-container" class="history-container">
        <h3>Past Tasks</h3>
        <div id="history-list">Loading history...</div>
    </div>

    <div id="status-container" class="status-container">
        <h3>Task Status</h3>
        <div class="status-item">
            <span class="status-label">Task ID:</span> <span id="task-id">-</span>
        </div>
        <div class="status-item" id="polling-indicator">
            <div class="loader" id="loader" style="display: none;"></div>
            <span class="status-label">Status:</span> <span id="task-status">-</span>
        </div>
        <div class="status-item">
            <span class="status-label">Current Node:</span> <span id="current-node">-</span>
        </div>
        <div class="status-item">
            <span class="status-label">Node Status:</span> <span id="node-status">-</span>
        </div>
    </div>

    <div id="result-container">
        <h3>Final Output</h3>
        <div id="result-content"></div>
    </div>
</div>

<script>
    let currentTaskId = null;
    let pollInterval = null;

    // Fetch history on load
    document.addEventListener("DOMContentLoaded", fetchHistory);

    async function fetchHistory() {
        try {
            const response = await fetch('/history');
            const data = await response.json();
            const historyList = document.getElementById('history-list');
            historyList.innerHTML = '';
            
            if (data.history.length === 0) {
                historyList.innerHTML = '<p>No past tasks found.</p>';
                return;
            }

            data.history.forEach(task => {
                const item = document.createElement('div');
                item.className = 'history-item';
                const statusClass = task.finished ? 'status-finished' : 'status-running';
                const statusText = task.finished ? 'Finished' : 'Incomplete / Running';
                
                item.innerHTML = `
                    <span>${task.task_id}</span>
                    <span class="status ${statusClass}">${statusText}</span>
                `;
                
                item.onclick = () => loadPastResult(task.task_id, task.finished);
                historyList.appendChild(item);
            });
        } catch (e) {
            console.error('Failed to fetch history', e);
        }
    }

    async function loadPastResult(taskId, isFinished) {
        if (!isFinished) {
            currentTaskId = taskId;
            document.getElementById('task-id').innerText = currentTaskId;
            document.getElementById('status-container').style.display = 'block';
            document.getElementById('result-container').style.display = 'none';
            startPolling();
            return;
        }

        try {
            const response = await fetch('/output/' + taskId);
            const data = await response.json();
            if (data.status === 'success') {
                document.getElementById('result-container').style.display = 'block';
                document.getElementById('status-container').style.display = 'none';
                document.getElementById('result-content').innerText = data.content;
            } else {
                alert('Could not fetch output: ' + data.message);
            }
        } catch (error) {
            console.error('Error fetching result:', error);
        }
    }

    function setButtonsDisabled(disabled) {
        document.getElementById('btn-story').disabled = disabled;
        document.getElementById('btn-report').disabled = disabled;
    }

    async function startTask(type) {
        const goal = document.getElementById('goal').value.trim();
        const model = document.getElementById('model-select').value;
        if (!goal) {
            alert('Please enter a goal.');
            return;
        }

        setButtonsDisabled(true);
        document.getElementById('status-container').style.display = 'block';
        document.getElementById('result-container').style.display = 'none';
        document.getElementById('task-id').innerText = 'Starting...';
        document.getElementById('task-status').innerText = '-';
        document.getElementById('current-node').innerText = '-';
        document.getElementById('node-status').innerText = '-';
        document.getElementById('loader').style.display = 'inline-block';

        try {
            const response = await fetch('/run/' + type, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ goal: goal, model: model })
            });
            const data = await response.json();

            if (data.status === 'started') {
                currentTaskId = data.task_id;
                document.getElementById('task-id').innerText = currentTaskId;
                startPolling();
            } else {
                alert('Error starting task: ' + data.message);
                resetUI();
            }
        } catch (error) {
            alert('Error: ' + error.message);
            resetUI();
        }
    }

    function startPolling() {
        if (pollInterval) clearInterval(pollInterval);
        pollInterval = setInterval(pollStatus, 2000);
    }

    async function pollStatus() {
        if (!currentTaskId) return;

        try {
            const response = await fetch(`/status/${currentTaskId}`);
            const data = await response.json();

            document.getElementById('task-status').innerText = data.status;

            if (data.current_node) {
                document.getElementById('current-node').innerText = data.current_node.goal;
                document.getElementById('node-status').innerText = data.current_node.status;
            }

            if (data.status === 'finished') {
                clearInterval(pollInterval);
                document.getElementById('loader').style.display = 'none';
                document.getElementById('node-status').innerText = 'Complete';
                document.getElementById('current-node').innerText = '-';
                fetchResult();
            } else if (data.status === 'error') {
                clearInterval(pollInterval);
                document.getElementById('loader').style.display = 'none';
                alert('Task error: ' + data.message);
                resetUI();
            }
        } catch (error) {
            console.error('Error polling status:', error);
        }
    }

    async function fetchResult() {
        try {
            const response = await fetch(`/output/${currentTaskId}`);
            const data = await response.json();
            
            if (data.status === 'success') {
                document.getElementById('result-container').style.display = 'block';
                document.getElementById('result-content').innerText = data.content;
            } else {
                alert('Could not fetch output: ' + data.message);
            }
        } catch (error) {
            console.error('Error fetching result:', error);
        } finally {
            resetUI();
        }
    }

    function resetUI() {
        setButtonsDisabled(false);
        if (document.getElementById('task-status').innerText !== 'finished') {
            document.getElementById('loader').style.display = 'none';
        }
    }
</script>

</body>
</html>
